# Standard fleet Dependabot config (weekly, grouped minor+patch) — alpha-engine-config-I2525
# Majors are surfaced as ONE grouped PR per ecosystem, throttled by a 30-day
# major-version cooldown — alpha-engine-config-I2734. NOTE: Dependabot requires a
# unique (package-ecosystem, directory, target-branch) per update config, so the
# I2734 intent CANNOT be a second per-ecosystem block on its own monthly schedule
# (that shape is invalid and disables ALL updates for the repo). The `majors`
# group + `cooldown.semver-major-days: 30` below is the closest legal expression.
#
# This file previously carried exactly that invalid duplicate-block shape — two
# blocks each for (pip, /) and (github-actions, /). The failure mode is SILENT
# non-enforcement, not an error: every ignore/groups/cooldown directive was a
# no-op, so this repo had none of the throttling the rest of the fleet had and
# nothing anywhere reported it. Found by the metron-ops-I244 fleet sweep, which
# checks for a duplicate (package-ecosystem, directory, target-branch) triple —
# krepis was the last repo in the fleet still on the broken shape.
#
# `pip`, NOT `uv` -- CORRECTED to `uv` 2026-09-09 (alpha-engine-config-I10348):
# this repo tracks both pyproject.toml AND uv.lock, and the `pip` ecosystem
# edits only pyproject.toml — every PR it opened left uv.lock silently stale
# rather than in sync with the dependency it had just bumped. `uv` regenerates
# uv.lock in the same commit, the same fix applied fleet-wide after
# `crucible-PR175`..`179` (2026-09-09) failed a `uv lock --check` CI gate this
# repo's own CI does not (yet) run — the drift here was invisible rather than
# red, which is the worse of the two failure modes.
#
# `cooldown` is dropped rather than carried across: it was validated live for
# `pip` (2026-07-16) and is UNVALIDATED for `uv` — this repo was bitten once
# already by an unvalidated Dependabot key silently disabling the whole file
# (see history above), so it is omitted here rather than assumed-supported,
# matching how github-actions already treats an unvalidated cooldown key.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
