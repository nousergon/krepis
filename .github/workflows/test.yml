name: Tests

# pytest matrix across declared Python versions. Required check on PRs to
# main so a change can't ship before being validated against the floor of
# declared support (3.9 — the EC2 always-on micro instance).

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # tests/test_spot_bootstrap.py parity-checks the rendered bootstrap
      # script against the two live Bash copies it replaces. Both sibling
      # repos are public; sparse-checkout just the one file each into
      # FLEET_DIR so the guard runs for real on CI instead of skipping
      # forever (alpha-engine-config-I7619 — a bare `pytest.skip` on an
      # absent sibling was a silent green on every CI run).
      - name: Checkout sibling repos for spot_bootstrap parity (I7619)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/nousergon-data
          sparse-checkout: |
            infrastructure/_spot_common.sh
          sparse-checkout-cone-mode: false
          path: .fleet/nousergon-data

      - name: Checkout sibling repos for spot_bootstrap parity (I7619, predictor)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/alpha-engine-predictor
          sparse-checkout: |
            infrastructure/_spot_common.sh
          sparse-checkout-cone-mode: false
          path: .fleet/alpha-engine-predictor

      # Every def test_*/class Test* under tests/ is actually collectible by
      # pytest (alpha-engine-config-I10005): tests/test_router.py carried four
      # def test_* for route_is_degraded, nested inside a helper AFTER its
      # `return` — never collected, indistinguishable from passing on every
      # surface this job reports. Fixed here by PR203; this step is the guard
      # for the class. The checker is stdlib-only (ast/pathlib), so it needs
      # no dependency install — runs once on the py3.9 leg rather than once
      # per matrix entry, since the finding does not depend on interpreter
      # version. Script lives in nousergon-lib (policy-shared-code
      # second-adoption: needed immediately by krepis and crucible CI), fetched
      # unpinned into a subdirectory — same pattern nousergon-lib's own
      # action-pin-guard.yml documents: the consumer pins the skeleton, not the
      # script, so a fix to the checker does not wait on a pin bump here.
      - name: Checkout the test-shape guard (nousergon-lib, I10005)
        if: matrix.python-version == '3.9'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/nousergon-lib
          sparse-checkout: |
            scripts/lint_test_shape.py
          sparse-checkout-cone-mode: false
          path: .fleet/nousergon-lib

      - name: Every test_*/Test* is collectible by pytest (I10005)
        if: matrix.python-version == '3.9'
        run: python3 .fleet/nousergon-lib/scripts/lint_test_shape.py .

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install gitleaks (for session_dlp tests)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
          # Minimal config so session_dlp scan-integration tests don't skip.
          # The fleet's real gitleaks-egress.toml chain (with custom Anthropic
          # key rules) is NOT committed here — session_dlp's test_secret_in_body
          # _is_blocked gracefully skips when the fake key doesn't match any rule.
          sudo mkdir -p /opt/groom-llm-routing
          printf '[extend]\nuseDefault = true\n' | sudo tee /opt/groom-llm-routing/gitleaks-egress.toml > /dev/null

      - name: Run pytest
        env:
          FLEET_DIR: ${{ github.workspace }}/.fleet
        run: python -m pytest -q --cov=krepis --cov-report=term-missing --cov-fail-under=90

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds stay silent. Reusable workflow + transport
  # live in nousergon-lib. See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@52cfe9ebaf7cce209870eba0c9e1683ed7ba0ea9
    secrets: inherit
