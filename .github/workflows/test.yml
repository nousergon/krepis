name: Tests

# pytest matrix across declared Python versions. Required check on PRs to
# main so a change can't ship before being validated against the floor of
# declared support (3.9 — the EC2 always-on micro instance).

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Shrink-only guard against hard-coded account / bucket literals (plan
      # S-04, alpha-engine-config-I12492; clause ENV-NO-LITERALS). The shared
      # check lives in nousergon-lib and is fetched unpinned, as
      # provider-linkage-guard.yml fetches its script. OBSERVE mode: it reports
      # NEW hits and STALE entries against .hardcoded-env-refs-baseline.json and
      # never blocks; continue-on-error also covers a fetch outage. S-16
      # (alpha-engine-config-I12504) makes it enforcing. Stdlib only, ~1-2 s.
      # Removed a literal? Lower the ceiling: python3 hardcoded_env_refs.py --update
      - name: Hard-coded environment references (observe, S-04)
        if: matrix.python-version == '3.12'  # one leg reports; the scan does not depend on the interpreter
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/hardcoded_env_refs.py" \
            https://raw.githubusercontent.com/nousergon/nousergon-lib/main/scripts/hardcoded_env_refs.py
          python3 "$RUNNER_TEMP/hardcoded_env_refs.py" --repo .

      # tests/test_spot_bootstrap.py parity-checks the rendered bootstrap
      # script against the two live Bash copies it replaces. Both sibling
      # repos are public; sparse-checkout just the one file each into
      # FLEET_DIR so the guard runs for real on CI instead of skipping
      # forever (alpha-engine-config-I7619 — a bare `pytest.skip` on an
      # absent sibling was a silent green on every CI run).
      - name: Checkout sibling repos for spot_bootstrap parity (I7619)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/nousergon-data
          sparse-checkout: |
            infrastructure/_spot_common.sh
          sparse-checkout-cone-mode: false
          path: .fleet/nousergon-data

      - name: Checkout sibling repos for spot_bootstrap parity (I7619, predictor)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/alpha-engine-predictor
          sparse-checkout: |
            infrastructure/_spot_common.sh
          sparse-checkout-cone-mode: false
          path: .fleet/alpha-engine-predictor

      # Every def test_*/class Test* under tests/ is actually collectible by
      # pytest (alpha-engine-config-I10005): tests/test_router.py carried four
      # def test_* for route_is_degraded, nested inside a helper AFTER its
      # `return` — never collected, indistinguishable from passing on every
      # surface this job reports. Fixed here by PR203; this step is the guard
      # for the class. The checker is stdlib-only (ast/pathlib), so it needs
      # no dependency install — runs once on the py3.9 leg rather than once
      # per matrix entry, since the finding does not depend on interpreter
      # version. Script lives in nousergon-lib (policy-shared-code
      # second-adoption: needed immediately by krepis and crucible CI), fetched
      # unpinned into a subdirectory — same pattern nousergon-lib's own
      # action-pin-guard.yml documents: the consumer pins the skeleton, not the
      # script, so a fix to the checker does not wait on a pin bump here.
      - name: Checkout the test-shape guard (nousergon-lib, I10005)
        if: matrix.python-version == '3.9'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/nousergon-lib
          sparse-checkout: |
            scripts/lint_test_shape.py
          sparse-checkout-cone-mode: false
          path: .fleet/nousergon-lib

      - name: Every test_*/Test* is collectible by pytest (I10005)
        if: matrix.python-version == '3.9'
        run: python3 .fleet/nousergon-lib/scripts/lint_test_shape.py .

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install gitleaks (for session_dlp tests)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
          # alpha-engine-config-I8058: no /opt ruleset stub here. The fleet's
          # real chain ships as package data (src/krepis/dlp_config/, PR211),
          # and a stub in an operator dir outranks it, so the suite scanned
          # with stock rules only. Assert the runner resolves the packaged
          # ruleset, so a reintroduced stub fails this step.
          dlp_preflight="$(python -m krepis.session_dlp preflight)"
          echo "$dlp_preflight"
          grep -qx 'ruleset_matches_packaged: True' <<<"$dlp_preflight"

      # Strict typing, BLOCKING (alpha-engine-config-I12607). Errors recorded in
      # `.basedpyright/baseline.json` are tolerated; any new one fails. On a PR the
      # baseline may only shrink: a count that grew for any rule means the baseline was
      # regenerated to absorb new errors, which is refused.
      # Missing RETURN annotations are not a pyright rule, so ruff's ANN rules run
      # over every source file the PR adds or changes: touch a file, annotate it.
      - name: Type check (basedpyright strict, baseline may only shrink)
        if: matrix.python-version == '3.12'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pip install --quiet basedpyright==1.40.2 ruff==0.17.1
          basedpyright
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::warning::type errors were fixed but .basedpyright/baseline.json was not shrunk; run basedpyright locally and commit the smaller baseline."
            git checkout -- .basedpyright/baseline.json
          fi
          if [ -n "${BASE_REF}" ] && git fetch --quiet --depth=1 origin "${BASE_REF}"; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR FETCH_HEAD HEAD -- 'src/*.py')
            if [ "${#changed[@]}" -gt 0 ]; then
              ruff check --select ANN --ignore ANN401 "${changed[@]}"
            fi
            if git cat-file -e "FETCH_HEAD:.basedpyright/baseline.json" 2>/dev/null; then
              git show "FETCH_HEAD:.basedpyright/baseline.json" > /tmp/baseline-base.json
              git show "HEAD:.basedpyright/baseline.json" > /tmp/baseline-head.json 2>/dev/null \
                || echo '{"files": {}}' > /tmp/baseline-head.json
              python3 - <<'PY'
          import collections, json, sys
          def counts(path):
              files = json.load(open(path))["files"]
              return collections.Counter(e["code"] for es in files.values() for e in es)
          base, head = counts("/tmp/baseline-base.json"), counts("/tmp/baseline-head.json")
          grown = {c: (base[c], n) for c, n in head.items() if n > base[c]}
          for code, (b, n) in sorted(grown.items()):
              print(f"::error::type baseline grew for {code}: {b} -> {n}. Fix the new errors instead of re-baselining.")
          sys.exit(1 if grown else 0)
          PY
            fi
          fi

      - name: Run pytest
        env:
          FLEET_DIR: ${{ github.workspace }}/.fleet
        run: python -m pytest -q --cov=krepis --cov-report=term-missing --cov-fail-under=90

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds stay silent. Reusable workflow + transport
  # live in nousergon-lib. See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@f21194128d054106b389c9a07221234aaa2b351f
    secrets: inherit
