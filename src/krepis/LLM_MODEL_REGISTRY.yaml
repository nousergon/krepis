# ============================================================================
# krepis LLM Model Registry — canonical model-group definitions.
#
# Every group is an ORDERED fallback chain: the first model listed is the
# PRIMARY (tried first); subsequent entries are FALLBACKS, tried in order.
#
# ════════════════════════════════════════════════════════════════════════════
# PROVIDER ROUTING
# ════════════════════════════════════════════════════════════════════════════
#
#   provider: deepseek, route: egress_proxy
#     → DeepSeek API via local egress proxy (port 8972)
#     → THIS IS THE DEFAULT for low / med / high groups
#
#   provider: gemini, route: egress_proxy
#     → Gemini API via local egress proxy (port 8974)
#
#   provider: openrouter, route: openrouter
#     → OpenRouter API — BACKUP ONLY for low / med / high
#     → PRIMARY for the ultra group
#
# ════════════════════════════════════════════════════════════════════════════
# GROUP SUMMARY
# ════════════════════════════════════════════════════════════════════════════
#
#   low:   deepseek-v4-flash          (DeepSeek direct, no reasoning)
#    →     gemini-2.5-flash            (Gemini direct)
#    →     gpt-oss-120b                (OpenRouter)
#    →     gemini-2.5-pro              (Gemini direct)
#
#   med:   deepseek-v4-flash          (DeepSeek direct, reasoning=max)
#    →     deepseek-v4-flash           (OpenRouter — same model, backup path)
#    →     deepseek-v4-pro             (DeepSeek direct, degrade)
#
#   high:  deepseek-v4-pro            (DeepSeek direct, reasoning=max)
#    →     deepseek-v4-pro             (OpenRouter — same model, backup path)
#
#   ultra: glm-5.2                     (OpenRouter — primary)
#    →     kimi-k3                     (OpenRouter — fallback)
#    →     deepseek-v4-pro             (DeepSeek direct, reasoning=max — last resort)
# ============================================================================

schema_version: 1

model_groups:
  # ── low: cheapest, no reasoning ────────────────────────────────────────
  low:
    - deepseek-v4-flash       # PRIMARY — DeepSeek API (egress proxy :8972)
    - gemini-2.5-flash         # fallback 1 — Gemini API (egress proxy :8974)
    - gpt-oss-120b             # fallback 2 — OpenRouter
    - gemini-2.5-pro           # fallback 3 — Gemini API (egress proxy :8974)

  # ── med: cheap model, reasoning=max ────────────────────────────────────
  med:
    - deepseek-v4-flash-max           # PRIMARY — DeepSeek API (egress proxy :8972)
    - deepseek-v4-flash-openrouter-max # fallback 1 — same model via OpenRouter
    - deepseek-v4-pro                 # fallback 2 — DeepSeek V4 Pro (degrade)

  # ── high: best DeepSeek model, reasoning=max ───────────────────────────
  high:
    - deepseek-v4-pro-max            # PRIMARY — DeepSeek API (egress proxy :8972)
    - deepseek-v4-pro-openrouter-max  # fallback 1 — same model via OpenRouter

  # ── ultra: best available, any provider ────────────────────────────────
  ultra:
    - glm-5.2                 # PRIMARY — OpenRouter (GLM 5.2)
    - kimi-k3                 # fallback 1 — OpenRouter (Kimi K3)
    - deepseek-v4-pro-max     # fallback 2 — DeepSeek API, last resort

# ── Model definitions ─────────────────────────────────────────────────────
models:
  # low group
  - id: deepseek-v4-flash
    name: DeepSeek V4 Flash
    provider: deepseek
    route: egress_proxy
    model: deepseek-v4-flash
    params:
      max_tokens: 8192
      reasoning:
        exclude: true
    status: active

  - id: gemini-2.5-flash
    name: Gemini 2.5 Flash
    provider: gemini
    route: egress_proxy
    model: gemini-2.5-flash
    params:
      max_tokens: 4096
    status: active

  - id: gpt-oss-120b
    name: GPT-OSS 120B
    provider: openrouter
    route: openrouter
    model: openai/gpt-oss-120b
    params:
      max_tokens: 4096
    status: active

  - id: gemini-2.5-pro
    name: Gemini 2.5 Pro
    provider: gemini
    route: egress_proxy
    model: gemini-2.5-pro
    params:
      max_tokens: 8192
    status: active

  # med group
  - id: deepseek-v4-flash-max
    name: DeepSeek V4 Flash (reasoning=max)
    provider: deepseek
    route: egress_proxy
    model: deepseek-v4-flash
    params:
      max_tokens: 8192
      reasoning:
        effort: max
    status: active

  - id: deepseek-v4-flash-openrouter-max
    name: DeepSeek V4 Flash (OpenRouter, reasoning=max)
    provider: openrouter
    route: openrouter
    model: deepseek/deepseek-v4-flash
    params:
      reasoning:
        effort: max
    status: active

  - id: deepseek-v4-pro
    name: DeepSeek V4 Pro
    provider: deepseek
    route: egress_proxy
    model: deepseek-v4-pro
    params:
      max_tokens: 8192
    status: active

  # high group
  - id: deepseek-v4-pro-max
    name: DeepSeek V4 Pro (reasoning=max)
    provider: deepseek
    route: egress_proxy
    model: deepseek-v4-pro
    params:
      reasoning:
        effort: max
    status: active

  - id: deepseek-v4-pro-openrouter-max
    name: DeepSeek V4 Pro (OpenRouter, reasoning=max)
    provider: openrouter
    route: openrouter
    model: deepseek/deepseek-v4-pro
    params:
      reasoning:
        effort: max
    status: active

  # ultra group
  - id: glm-5.2
    name: GLM 5.2
    provider: openrouter
    route: openrouter
    model: zhipuai/glm-5.2
    params:
      max_tokens: 16384
    status: active

  - id: kimi-k3
    name: Kimi K3
    provider: openrouter
    route: openrouter
    model: moonshotai/kimi-k3
    params:
      max_tokens: 16384
    status: active
