# CANONICAL DLP RULESET -- krepis package data (`krepis/dlp_config/`).
#
# This file is the ONE source of the fleet's custom secret-shape rules, and
# is shipped byte-identical to every other place that scans with them:
#   nousergon/krepis              src/krepis/dlp_config/gitleaks-custom.toml   <- CANONICAL
#   nousergon/alpha-engine-config infrastructure/groom-llm-routing/gitleaks-custom.toml
#   nousergon/claude-code-config  llm-routing/gitleaks-custom.toml
#   nousergon/nousergon-lib       src/nousergon_lib/egress/gitleaks-custom.toml
# If you are reading this anywhere but krepis, you are reading a COPY.
#
# Each copy's own CI parses its copy and the one on krepis `main` and FAILS on
# any rule-level difference (ids, regexes, allowlists, entropy, keywords,
# tags, [extend]) -- comments are ignored (alpha-engine-config-I9712). So a
# rule change lands here first, and every copy stays red until it follows.
# Never edit a copy alone: that is how both halves of I9712 lived for a month
# on one side only, each side missing a real fix the other had.
#
# Reconciled 2026-10-15 (alpha-engine-config-I9712) as the UNION of the fixes
# from the two diverged copies -- all four deltas ADOPTED:
#   - Telegram: trailing \b removed (claude-code-config-I112)
#   - nousergon-aws-access-key-id added (claude-code-config-I112)
#   - Anthropic: >=8 body chars, `{8,}` (alpha-engine-config-I4946)
#   - IBKR: `<...>` documentation placeholders excluded (alpha-engine-config-I4946)
#
# CONSTRAINT THAT MUST NOT BE LOST: a LONG BOUNDED quantifier (e.g. `{93}`)
# silently fails to fire under `useDefault = true` on gitleaks 8.30.1 (see the
# Anthropic rule's comment). Several rules below are shaped around that
# measured engine defect, not around what reads well. A "cleanup" that
# tightens a quantifier here silently disables the rule.
#
title = "Fleet-specific secret-shape rules (config-I3011)"

# Extends gitleaks' stock ruleset (~180 provider-specific rules: generic AWS,
# GitHub, Slack, Stripe, etc). gitleaks-egress.toml then chain-extends THIS
# file (see its own [extend] block) rather than useDefault directly, so both
# active scan paths pick these rules up automatically with zero code changes:
#   - check_file_path.sh (Read/Edit/Write/Grep/Glob/NotebookEdit PreToolUse hook)
#   - llm_egress_proxy.py (outbound HTTP body scan, GITLEAKS_CONFIG constant;
#     one instance per provider)
# Both already point at gitleaks-egress.toml; only the toml wiring changed.
#
# Each rule below has a positive+negative fixture pair in claude-code-config
# under llm-routing/gitleaks-custom-fixtures/{positive,negative}/<rule-id>.txt,
# exercised by test_gitleaks_custom_rules.sh, plus randomised class fixtures in
# test_gitleaks_class_coverage.py. Fixture secrets are OBVIOUSLY fake (FAKE/TEST
# markers baked into the matched span) — never a real credential shape copied
# from a live key.
[extend]
useDefault = true

# ------------------------------------------------------------------
# Telegram bot tokens
# ------------------------------------------------------------------
# Format: <8-10 digit bot id>:<35-char token>, e.g. what BotFather issues.
# Fleet uses these for the Overseer/groom Telegram notify helper.
[[rules]]
id = "nousergon-telegram-bot-token"
description = "Telegram bot token (BotFather format: <numeric id>:<35-char secret>)"
# The trailing \b was REMOVED 2026-07-29 (claude-code-config-I112). A token
# whose 35th character is '-' cannot be matched with a trailing \b: '-' is a
# non-word character, so no word boundary exists between it and the following
# newline. BotFather issues tokens containing '-', so roughly 1 in 64 real
# tokens was silently unmatched by this rule. Found by
# test_gitleaks_class_coverage.py, which is why that test uses randomised
# fixtures rather than one fixed string. Go's RE2 has no lookahead, so there
# is no negative-lookahead alternative -- dropping the anchor is the fix.
regex = '''\b\d{8,10}:[A-Za-z0-9_-]{35}'''
tags = ["telegram", "fleet-custom"]

# ------------------------------------------------------------------
# OpenRouter API key
# ------------------------------------------------------------------
# Documented format: "sk-or-v1-" followed by 64 lowercase hex characters.
[[rules]]
id = "nousergon-openrouter-api-key"
description = "OpenRouter API key (sk-or-v1-<64 hex>)"
regex = '''\bsk-or-v1-[a-f0-9]{64}\b'''
tags = ["openrouter", "fleet-custom"]

# ------------------------------------------------------------------
# Anthropic API key
# ------------------------------------------------------------------
# CONFIRMED GITLEAKS ENGINE DEFECT (config-I3011 build, 2026-07-19), filed
# upstream-adjacent as alpha-engine-config-I3012 -- read before touching
# this rule:
#
# The full-secret regex a real Anthropic key needs ("sk-ant-api03-" + a
# 93-char body + "AA", matching gitleaks' OWN stock "anthropic-api-key"
# rule) DOES NOT FIRE on this machine's gitleaks v8.30.1 whenever
# `useDefault = true` is in effect -- verified with THREE independent
# reproductions: (1) this custom rule using that exact shape, (2) gitleaks'
# own unmodified default "anthropic-api-key"/"anthropic-admin-api-key"
# rules alone (useDefault=true, zero custom rules) against a syntactically
# valid fake key, (3) plain `gitleaks detect` with NO --config flag at all
# in a neutral empty directory. All three silently report "no leaks found"
# for content a plain Python re.search() confirms DOES match the pattern.
# The same rule/content combination fires reliably standalone (no
# useDefault). This means: right now, a real leaked Anthropic key would
# NOT be caught by gitleaks on this machine, in ANY repo whose
# .gitleaks.toml uses useDefault=true (i.e. the whole fleet) -- this
# predates and is independent of this build.
#
# Rather than ship a full-secret rule I've proven doesn't fire (false
# confidence), this rule intentionally trades secret-capture precision for
# RELIABLE FIRING: matching just the fixed, short literal prefix
# "sk-ant-api03-" (13 chars, no long quantifier) sidesteps whatever makes
# long bounded-repetition quantifiers silently fail under useDefault=true.
# For a BLOCKING gate this is sufficient -- the hook/proxy only needs to
# know content contains what looks like a real key, not capture its exact
# bytes. Verified firing consistently (3/3 repeated runs) where the
# full-length version failed 100% of attempts across 15+ length/prefix
# combinations during this investigation.
[[rules]]
id = "nousergon-anthropic-api-key"
description = "Anthropic API key (sk-ant-api03- + key body); short open-ended quantifier avoids the useDefault long-quantifier defect"
# 2026-07-28 (alpha-engine-config-I4946): was prefix-ONLY (`\bsk-ant-api03-`),
# which fired on every PROSE MENTION of the prefix -- including this file's own
# comments and any diff of it. That blocked two sweep CI-fix batches whose agent
# was reading a diff of these very rules. Requiring >=8 body chars keeps real
# keys (95+ body chars) firing while a bare prefix in text no longer matches.
# `{8,}` is a SHORT open-ended quantifier -- deliberately not the 93-char BOUNDED
# form that silently fails under useDefault, which is why this rule was
# prefix-only in the first place.
regex = '''\bsk-ant-api03-[A-Za-z0-9_-]{8,}'''
tags = ["anthropic", "fleet-custom", "gitleaks-defect-workaround"]

# ------------------------------------------------------------------
# DeepSeek API key
# ------------------------------------------------------------------
# ASSUMPTION FLAGGED FOR VERIFICATION: built from DeepSeek's publicly
# documented key format (OpenAI-SDK-compatible convention: "sk-" + 32
# lowercase hex chars), NOT confirmed against the real live key's actual
# prefix — the auto-mode classifier correctly declined a shell command that
# would have read even a redacted prefix of secrets.env mid-session (see
# config-I3011 build notes), and per this task's absolute rule that block
# was respected rather than routed around. If this regex doesn't fire on a
# real (deliberately fake-valued) DeepSeek-shaped key during the next live
# gitleaks-baseline refresh, tighten/loosen the {N} count then.
# No collision risk with the anthropic/openrouter rules above: both of those
# require a literal "-ant-" or "-or-" immediately after "sk-", which breaks
# the contiguous [a-f0-9]{32} run this rule requires.
[[rules]]
id = "nousergon-deepseek-api-key"
description = "DeepSeek API key (sk-<32 hex chars>) -- format assumed from public docs, see comment"
regex = '''\bsk-[a-f0-9]{32}\b'''
tags = ["deepseek", "fleet-custom", "unverified-format"]

# ------------------------------------------------------------------
# AWS temporary session-token shape (STS AssumeRole / GetSessionToken)
# ------------------------------------------------------------------
# MEASURED FALSE, 2026-07-29 (claude-code-config-I112). This comment used to
# read "Long-lived AWS keys are already covered by gitleaks' default aws-
# access-token / aws-secret-key rules (useDefault above)". They are not:
# over 20 randomised `AWS_ACCESS_KEY_ID=AKIA<16>` fixtures the stock
# aws-access-token rule fired 5/20 on one seed and 1/20 on another, identically
# under `useDefault` alone and under the full gitleaks-egress.toml chain -- so
# this is the stock rule's own entropy gate, not our config. The same regex
# declared as a fleet rule WITHOUT an entropy gate fires 20/20 (see
# nousergon-aws-access-key-id below). Same failure class as the Anthropic
# comment above: a stock rule that silently detects a fraction of the time.
# Temporary STS credentials
# add a THIRD value, the session token: a long base64-ish blob that is high
# entropy but otherwise looks like nothing else. It reliably starts with one
# of a small set of magic-byte prefixes baked into AWS's internal protobuf
# encoding (well-known across leak-detection tooling, not fleet-specific):
#   FQoGZXIvYXdzE / FQoDYXdz / FwoGZXIvYXdz / IQoJb3JpZ2luX2Vj
[[rules]]
id = "nousergon-aws-session-token"
description = "AWS STS temporary session token (magic-byte-prefixed base64 blob)"
regex = '''\b(FQoGZXIvYXdzE|FQoDYXdz|FwoGZXIvYXdz|IQoJb3JpZ2luX2Vj)[A-Za-z0-9/+=]{100,900}\b'''
tags = ["aws", "sts", "fleet-custom"]

# ------------------------------------------------------------------
# IBKR IBC config.ini credential lines
# ------------------------------------------------------------------
# ~/ibc/config.ini itself is already hard-blocked by PATH in
# secret-file-patterns.txt (belt-and-suspenders: this rule catches the same
# credential lines if they ever get pasted/copied into a DIFFERENT file --
# a doc, a chat log, a debug dump -- that the path-based block wouldn't
# cover. Field names (IbLoginId/IbPassword/FIXLoginId/FIXPassword) are
# IBC's own public config-key names, not secret in themselves; only the
# value after "=" is. NOTE: ~/ibc/config.ini does not exist on this laptop
# (IBC/IB Gateway runs on the EC2 executor box per ~/Development/CLAUDE.md
# "Shared Infrastructure" -- this rule is forward cover for the case content
# gets copied to the laptop, not evidence it currently is here).
[[rules]]
id = "nousergon-ibkr-config-credential-line"
description = "IBC config.ini credential line (one of IbLoginId/IbPassword/FIXLoginId/FIXPassword, then an equals sign and a real value)"
# 2026-07-28 (alpha-engine-config-I4946): the value must not be a `<...>`
# DOCUMENTATION PLACEHOLDER. This rule's own description used to end
# `... = <value>)` and therefore matched ITSELF -- any diff of this file blocked
# the request carrying it. gitleaks uses RE2, which has no lookahead, so the
# exclusion is a leading character class rather than `(?!<)`.
# 2026-10-15 (alpha-engine-config-I9712): I4946 rewrote that description to end
# `... = real-value)`, which STILL matched itself -- `real-value` is not a
# placeholder. The description now names the shape in words, with no field
# name followed by `=`, and krepis's tests scan this whole file and require it
# to come back clean.
regex = '''(?i)\b(IbLoginId|IbPassword|FIXLoginId|FIXPassword)\s*=\s*[^<\s]\S*'''
tags = ["ibkr", "fleet-custom"]

# ------------------------------------------------------------------
# SSM GetParameter --with-decryption JSON response shape
# ------------------------------------------------------------------
# The PRIMARY defense is pre-execution: check_bash_command.sh's
# SECRET_DUMP_PATTERNS already hard-blocks any Bash command containing
# "--with-decryption" outright, so this command's output cannot enter
# context via the Bash tool at all -- there is no fixed regex "shape" for
# an arbitrary decrypted SSM parameter value the way there is for a
# provider API key, so a content rule can't be the primary control here.
# This rule is defense-in-depth for the same content arriving via a
# DIFFERENT channel (e.g. someone pastes a decrypted-parameter JSON blob
# into a doc/log that then gets Read/Grep'd). Deliberately requires the
# co-occurrence of Type":"SecureString" + a Name path + a Value field on
# the same line/object to stay specific to genuine SSM SecureString
# responses rather than firing on any JSON with a "Value" key.
[[rules]]
id = "nousergon-ssm-secure-string-response"
description = "AWS SSM GetParameter --with-decryption JSON response body (SecureString value)"
regex = '''"Name"\s*:\s*"/[^"]+"\s*,\s*"Type"\s*:\s*"SecureString"\s*,\s*"Value"\s*:\s*"[^"]{8,}"'''
tags = ["aws", "ssm", "fleet-custom"]

# ------------------------------------------------------------------
# AWS access key id (long-lived and STS), explicit
# ------------------------------------------------------------------
# Exists because the stock aws-access-token rule is unreliable -- see the
# corrected comment above. Deliberately carries NO entropy threshold and no
# keyword gate: an AWS key id is a fixed 4-char prefix plus exactly 16
# uppercase-alphanumerics, so the shape alone is specific enough and an
# entropy floor is the exact thing that makes the stock rule flaky.
#
# Scope note: a key ID is an identifier, not by itself an authenticator --
# the secret is the paired secret access key. It is still treated as a block
# signal because its presence means credential material is in context, and
# because that is the pre-existing production behaviour (blocked-events shows
# 748 findings on Lambda REPORT lines and presigned S3 URLs). This rule does
# not widen what gets blocked; it makes the existing intent actually work.
#
# Allowlisted: AWS's own published example values, which appear in
# documentation the agents legitimately read.
[[rules]]
id = "nousergon-aws-access-key-id"
description = "AWS access key id (AKIA/ASIA/ABIA/ACCA/A3T prefix + 16 uppercase alnum) -- explicit because the stock rule fires ~5-25% of the time"
regex = '''\b(AKIA|ASIA|ABIA|ACCA|A3T[A-Z0-9])[A-Z0-9]{16}\b'''
tags = ["aws", "fleet-custom"]
  # regexTarget = "match" is REQUIRED and not the default. Verified 2026-07-29
  # against gitleaks 8.30.1: with the default target (the extracted secret)
  # this allowlist has NO effect -- nor do `stopwords`, nor the older
  # singular [rules.allowlist] form. Only "match" suppresses. Do not drop it.
  [[rules.allowlists]]
  description = "AWS published documentation example key ids"
  regexTarget = "match"
  regexes = ['''(AKIA|ASIA)IOSFODNN7EXAMPLE''']
