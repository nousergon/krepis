[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krepis"
version = "0.59.87"
description = "krepis (Greek κρηπίς — the foundation a structure stands on): general-purpose Python primitives for production data and LLM pipelines on AWS — logging, SSM secrets, Telegram/SNS/Web Push alerts, bounded-backoff HTTP retry, S3 writer locks, the Anthropic payload chokepoint, LLM cost telemetry, the LLM-as-judge transport core, trading-calendar/date helpers, and EC2-spot/SSM resilience."
readme = "README.md"
# EC2 still runs Python 3.9 on the always-on micro instance, so PEP 604
# union syntax (``str | None``) is deferred via ``from __future__ import
# annotations`` and eval_type_backport on 3.9.
requires-python = ">=3.9"
authors = [{ name = "Brian McMahon" }]
license = { text = "MIT" }
keywords = ["aws", "ssm", "telemetry", "pipeline", "alerts", "trading-calendar"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    # Pydantic V2 evaluates field annotations at class-construction time;
    # on Python 3.9 it cannot eval PEP 604 union syntax even under
    # ``from __future__ import annotations``. eval_type_backport is the
    # backport Pydantic's own error message points to. 3.10+ is native.
    "eval_type_backport>=0.2.0; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/nousergon/krepis"
Repository = "https://github.com/nousergon/krepis"
Issues = "https://github.com/nousergon/krepis/issues"

[project.optional-dependencies]
# flow-doctor pipeline error-handler. krepis.logging owns the integration glue
# (setup_logging attaches a FlowDoctorHandler; flow_doctor is imported lazily),
# so the dependency is declared here — a consumer wires flow-doctor with
# `krepis[flow_doctor]` + `from krepis.logging import setup_logging`, no AGPL
# nousergon-lib required.
#
# krepis.logging touches exactly two names off the bare `flow_doctor`
# package root — `flow_doctor.FlowDoctor.from_config()` and
# `flow_doctor.FlowDoctorHandler(...)` (src/krepis/logging.py) — both are
# base-package exports needing no extra. The old `[diagnosis,s3]` extras
# pulled the `anthropic` SDK (diagnosis) and `boto3` (s3 storage backend)
# onto every `krepis[flow_doctor]` consumer regardless of whether it uses
# LLM diagnosis or an S3 dedup store — neither is krepis's own glue, both
# are a consumer's own flow-doctor.yaml choice. flow-doctor 0.15.0 removed
# the `anthropic` distribution outright and the `diagnosis` extra with it
# (alpha-engine-config-I7722); a consumer that wants LLM diagnosis or S3
# storage now names `flow-doctor[diagnosis-openai]`, `flow-doctor[router]`,
# or `flow-doctor[s3]` itself. No upper bound: 0.8.1 through 0.15.0's
# CHANGELOG carries no change to `FlowDoctor.from_config()` or
# `FlowDoctorHandler`'s constructor signature, the only surface krepis
# touches (0.15.0 breaks `diagnosis.provider` defaults and the `anthropic`
# transport, neither reachable from krepis's own glue).
#
# FLOOR RAISED TO 0.16.0 AND LOAD-BEARING (alpha-engine-config-I8298). Below
# it, `TelegramNotifier.validate()` raises a transport failure as a config
# error, and `TimeoutError` is not a `URLError` subclass so a read timeout
# escaped its handler entirely and propagated out of `FlowDoctor.__init__`
# under `strict`. `setup_logging` here is called at MODULE level by every
# Lambda handler in the fleet and `_is_deployed()` makes `strict` True in
# every deployed runtime, so on 2026-08-24 roughly 90 seconds of an
# unresponsive api.telegram.org failed the IMPORT of
# alpha-engine-predictor-inference five times and the postclose trading
# pipeline ran with MarketHoursGate and DeployDriftCheck both degraded.
# 0.16.0 splits verdict from transport and bounds the preflight. Do not
# lower this floor: krepis is the layer that puts flow-doctor on the import
# path, so krepis is the layer that owes consumers a version where being on
# that path is safe.
# Release note (alpha-engine-config-I8308): the floor above merged in
# krepis-PR184 and shipped to NOBODY — auto-version-bump keyed its trigger
# on `src/` alone, so the dependency change never produced a release and
# PyPI kept serving `flow-doctor>=0.8.1`. This edit is deliberate: it puts
# pyproject.toml in the same commit as the trigger fix, so merging this PR
# releases the floor by the merge button alone.
flow_doctor = ["flow-doctor>=0.16.0"]
# krepis.llm transports. Both SDKs are lazy-imported at call time, so a
# consumer installs only the transport(s) its ModelSpec can resolve to:
# `krepis[anthropic]` for the native Anthropic transport, `krepis[openai]`
# for OpenAI / OpenRouter / any OpenAI-compatible endpoint. (These were
# intended to ship in 0.9.0 with krepis.llm; a silently-no-op'd edit
# dropped them from the merged pyproject — restored in 0.9.1.)
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
# krepis.webpush's send_push() transport. Lazy-imported at call time (same
# shape as anthropic/openai above) - a consumer installs krepis[webpush]
# only if it actually sends Web Push notifications.
webpush = ["pywebpush>=1.14"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "moto>=5.0",
    # litellm 1.97.0 cannot be imported under Python 3.10: its `LiteLLM_Params`
    # model carries a forward reference to `ChatCompletionReasoningSummaryTextBlock`
    # that pydantic cannot resolve there, and every `krepis.router` group
    # resolution raises `PydanticUserError` at litellm/router.py:7525. It is
    # Python-version-dependent, not dependency-dependent: measured
    # 2026-08-16 on 3.10 with litellm 1.97.0 against openai 2.54.0 AND 1.109.1,
    # pydantic 2.13.4 AND 2.11.10 -- 9 failures in all four combinations, while
    # the identical set passes on 3.12. 1.96.0 is the last release that imports
    # on 3.10, and 1.97.0 is the newest that installs there at all, so the cell
    # is unsatisfiable without this cap.
    #
    # 3.9 already resolves below the cap on its own; this makes 3.10 match it
    # rather than dropping a declared interpreter to make CI quiet
    # (alpha-engine-config-I7464). Remove when a litellm release supporting
    # 3.10 fixes the forward ref.
    "litellm>=1.0,<1.97; python_version < '3.11'",
    "litellm>=1.0; python_version >= '3.11'",
    # Validates the router resolve contract against resolve_schema.json.
    # Declared (not merely assumed present) so the contract test RUNS in CI
    # instead of importorskip'ing itself into silence -- an unrun guard is
    # how the I4453 field rename reached four consumers unnoticed.
    "jsonschema>=4.0",
    # tests/test_trading_calendar_reconciliation.py reconciles
    # NYSE_HOLIDAYS + NYSE_EARLY_CLOSES against the reference calendar for
    # the whole declared range and fails CI on divergence
    # (alpha-engine-config-I9998). Dev-only -- never a runtime dependency
    # of krepis itself; see trading_calendar.py's module docstring for why
    # the full runtime swap was rejected (pulls numpy/pandas onto every
    # consumer, including Lambdas that install krepis for unrelated
    # primitives). exchange_calendars 4.x requires Python >=3.10 (measured
    # against 4.13.2's METADATA), so the reconciliation test
    # importorskip's on the 3.9 leg of the matrix -- the same pattern
    # already used for the litellm cap above -- and runs for real on the
    # other four declared interpreters.
    "exchange_calendars>=4.0; python_version >= '3.10'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `dlp_config/*.toml` is the in-process DLP ruleset. It is package DATA, not a
# sample: `krepis.session_dlp` resolves it as the last-resort config so no
# execution context can be missing the control (see that module's docstring).
# Dropping it from this list restores the outage it exists to close, silently —
# `tests/test_session_dlp_packaged_config.py` fails if it is unreadable.
"krepis" = ["model_pricing.yaml", "cache_minimums.yaml", "fleet_event_schema_v1.json", "resolve_schema.json", "py.typed", "dlp_config/*.toml"]

[tool.uv]
# uv.lock is the DEV lockfile only: CI (test.yml's 3.9-3.13 matrix) and every
# consumer install with pip against the ranges above, never from this lock.
# Dependabot's `uv` updater pins each proposed version EXACTLY and re-locks
# across every interpreter requires-python admits, so any release that drops
# 3.9 (pydantic 2.14, requests 2.34.2, pytest 9.1, anthropic 1.13, ...) or
# crosses the litellm <1.97 py<3.11 cap was unresolvable, and the weekly
# Dependabot run on main went red (krepis run 38598730004, 2026-10-14).
# Locking only the interpreters development actually uses ends that without
# touching requires-python: the 3.9 dashboard box still installs krepis.
environments = ["python_full_version >= '3.11'"]
# Security floor for the dev lock (alpha-engine-config-I12703). filelock below
# 4.2.1 carries the advisory krepis-PR266 cleared, and every litellm from
# 1.104.0 on caps `filelock<4.0`, so Dependabot's minor group (krepis-PR268,
# litellm 1.103.9 -> 1.106.2) silently re-locked filelock 4.2.4 -> 3.32.7 and the
# filelock security update went red again (run 40821269127, 2026-10-29). The
# constraint makes that downgrade unresolvable instead of silent: litellm stays
# on the 1.103 line, which already clears every litellm GHSA (the newest fix
# is 1.88.6), until a litellm release accepts filelock 4. Dev lock only; consumers
# install with pip against the ranges above.
# litellm>=1.88.6 is the same kind of floor (alpha-engine-config-I12703): the
# Dependabot majors group (krepis-PR271, anthropic 2 + openai 3) re-locked
# litellm 1.103.10 -> 1.83.0: current litellm caps `openai<3.0.0`, so the
# resolver backtracked to 1.83.0, which accepts openai 3 and re-opens all 14
# GHSAs. 1.88.6 is the newest fix among them; openai stays on 2.x here.
constraint-dependencies = ["filelock>=4.2.1", "litellm>=1.88.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
# Strict typing gate (fleet strict-typing rollout, alpha-engine-config-I12607).
# CI runs it as a BLOCKING step in the existing test job.
#
# `.basedpyright/baseline.json` records the errors that existed when the gate was
# switched on. basedpyright ignores exactly those and fails on any NEW error, so
# every new or changed line is held to strict from day one. The baseline shrinks
# as old errors are fixed; CI refuses a PR that grows any rule's count. Never
# regenerate it (`--writebaseline`) to get a PR green: fix the code, or suppress
# one line with `# pyright: ignore[<rule>]` and say why.
include = ["src/krepis"]
# Analysed at the declared floor, where version-specific syntax regressions bite.
pythonVersion = "3.9"
typeCheckingMode = "strict"
# Strict mode does not flag an explicit `Any`; this does. A needed `Any` (an
# untyped SDK object, raw JSON) gets a line-level ignore with a reason.
reportExplicitAny = "error"
# A bare `# type: ignore` silences every rule on the line; only rule-scoped
# `# pyright: ignore[rule]` comments are honoured.
enableTypeIgnoreComments = false
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
